<html>
  <body>
    <h1>Bank Site（模擬銀行系統）</h1>
    <p>此為模擬銀行通知服務。</p>

{% if user.is_authenticated and user.is_superuser %}

    <p>
        歡迎，{{ user.username }}（管理員）
    </p>

    <p>
        <a href="{% url 'notify:db_query_tool' %}">
            🔍 資料庫查詢工具
        </a>
    </p>

    <p>
        <a href="{% url 'notify:query_and_simulate' %}">
            🏦 資料庫查詢 + 模擬付款工具
        </a>
    </p>

    <form method="post" action="{% url 'admin:logout' %}">
        {% csrf_token %}
        <button type="submit">
            登出
        </button>
    </form>

{% else %}

    <p>
        <a href="/admin/login/?next=/notify/">
            管理員登入
        </a>
    </p>

{% endif %}


  </body>
</html>
